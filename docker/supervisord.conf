[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24
autorestart=true
priority=10
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

; Session D-Bus at a fixed address so xfwm4 (xfconf) and the RCP app (dconf,
; GSettings) find a bus instead of retrying dbus-launch on every access.
[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=unix:path=/tmp/dbus-session-bus
autorestart=true
priority=15
startsecs=2
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.err

[program:xfwm4]
command=/bin/bash -c "until [ -S /tmp/.X11-unix/X99 ] && [ -S /tmp/dbus-session-bus ]; do sleep 0.2; done; exec /usr/bin/xfwm4 --compositor=off --sm-client-disable"
environment=DISPLAY=":99",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/dbus-session-bus"
autorestart=true
priority=20
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/xfwm4.log
stderr_logfile=/var/log/supervisor/xfwm4.err

; X11VNC_AUTH is exported by /entrypoint.sh: "-nopw" (default) or "-passwd <pw>"
; when VNC_PW is set.
[program:x11vnc]
command=/bin/bash -c "until [ -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; exec /usr/bin/x11vnc -display :99 -rfbport %(ENV_VNC_PORT)s %(ENV_X11VNC_AUTH)s -forever -shared -noxdamage"
autorestart=true
priority=30
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web /opt/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=40
startsecs=2
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

; One-shot: wait for the workbench window, then maximize it to fill the
; virtual desktop. Exits afterwards (autorestart=false, startsecs=0).
[program:maximize]
command=/usr/local/bin/archsafe-maximize.sh
environment=DISPLAY=":99"
autorestart=false
startsecs=0
priority=60
stdout_logfile=/var/log/supervisor/maximize.log
stderr_logfile=/var/log/supervisor/maximize.err

; Restores the workbench if it is ever minimised. There is no panel or taskbar
; in this container, so a minimised window would otherwise be unrecoverable.
[program:keepvisible]
command=/usr/local/bin/archsafe-keep-visible.sh
environment=DISPLAY=":99"
autorestart=true
startsecs=0
priority=65
stdout_logfile=/var/log/supervisor/keepvisible.log
stderr_logfile=/var/log/supervisor/keepvisible.err

; The GUI itself. autorestart=true also brings the workbench back if a
; reviewer closes the window.
[program:archsafe]
command=/bin/bash -c "until [ -S /tmp/.X11-unix/X99 ] && [ -S /tmp/dbus-session-bus ]; do sleep 0.2; done; exec /opt/archsafe/ArchSafeUnifiedModeler/ArchSafeUnifiedModeler -data /home/archsafe/workspace"
environment=DISPLAY=":99",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/dbus-session-bus",NO_AT_BRIDGE="1"
autorestart=true
priority=50
startsecs=10
startretries=10
stdout_logfile=/var/log/supervisor/archsafe.log
stderr_logfile=/var/log/supervisor/archsafe.err
