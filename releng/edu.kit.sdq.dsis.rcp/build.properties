# Feature build configuration.
#
# 'root' declares product root files: the CONTENTS of rootfiles/ are copied
# into the root of the assembled RCP product. The rootfiles/casestudies tree is
# populated at build time from the canonical /casestudies directory by the
# maven-resources-plugin copy in pom.xml (so the case studies are never
# duplicated in version control, yet always ship with the product).
bin.includes = feature.xml
root = rootfiles
