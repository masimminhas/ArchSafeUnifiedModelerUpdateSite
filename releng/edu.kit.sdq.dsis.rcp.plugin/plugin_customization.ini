org.eclipse.ui/defaultPerspectiveId=org.eclipse.sirius.ui.tools.perspective.modeling
org.eclipse.ui.intro/showIntro=false

# Default to the Light theme on first launch (do not follow OS dark mode).
# NOTE: this RCP bundles only e4_default (Light), e4_dark and e4_system;
# the IDE-only "Classic" theme (e4_classic) is not available here.
# Applies on a fresh workspace; users can still switch via
# Window > Preferences > General > Appearance.
org.eclipse.e4.ui.css.swt.theme/themeid=org.eclipse.e4.ui.css.theme.e4_default